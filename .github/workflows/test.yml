# Run the test suites that already exist.
#
# There was no CI. The repo carries ~1,200 unit assertions across 100 files and
# roughly 150 Playwright specs, and not one of them gated a deploy — Cloudflare
# Workers Builds runs `vite build` on push and nothing else. Two of those suites
# are load-bearing repo guarantees rather than ordinary tests:
#
#   docsite.test.mjs        — extracts the public surface (the endpoints array,
#                             registerTool calls, CARD_KINDS, TABS, router
#                             branches) and diffs it against a snapshot, so
#                             shipping a surface change with stale docs fails.
#   seoProbeContract.test.mjs — mirrors the live seo_health_expectations rows so
#                             a prose edit fails here instead of turning the
#                             production prober red six hours later.
#
# Both only work if something runs them. This is that.
#
# `npm run docs:check` asserts that regenerating the docs is a no-op, which is
# what catches "edited the markdown, forgot to run docs:build".
#
# Playwright is deliberately not here yet: those specs need a built app and a
# dev server, and several are documented as flaky. Adding them badly would teach
# everyone to ignore a red X, which is worse than not running them.
#
# The bundle job builds the app and holds what a signed-in open downloads under
# ceilings (scripts/bundleBudget.mjs): the entry, its stylesheet, and the
# AppShell closure that has to arrive before the canvas paints. It also fails
# when a chunk that was split out on purpose (the 3D graph, the charts, the PDF
# writer) is pulled back into that closure by a static import.

name: test

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            boards/package-lock.json
            scout/package-lock.json

      - name: Install boards dependencies
        working-directory: boards
        run: npm ci

      # A runtime dependency with a known critical advisory fails the build.
      # Dev tooling is left to Dependabot's pull requests. The bar moves to
      # high once the remaining highs (held by partykit's and Capacitor's own
      # pins) have releases that clear them.
      - name: No critical advisory in a runtime dependency
        working-directory: boards
        run: npm audit --omit=dev --audit-level=critical

      # `npm test` in boards is `node --test src/lib/*.test.mjs
      # ../scout/src/*.test.mjs` — it reaches ACROSS into the scout package, and
      # scout/src/media.test.mjs imports sharp. Installing only boards makes the
      # suite fail on a missing module rather than on anything real, which is
      # exactly how CI trains people to ignore it. Install what the command runs.
      - name: Install scout dependencies
        working-directory: scout
        run: npm ci

      - name: Unit tests
        working-directory: boards
        run: npm test

      # Regenerating the docs must produce no diff.
      - name: Docs are in sync with the code
        working-directory: boards
        run: npm run docs:check

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: boards/package-lock.json

      - name: Install boards dependencies
        working-directory: boards
        run: npm ci

      # A fake Supabase pair keeps the signed-in app in the build: with no
      # configured client it is dead-code-eliminated and the budget would
      # measure the signed-out page alone. `vite build`, not `npm run build`:
      # the prebuild hook restamps buildInfo.js and regenerates the docs, which
      # the unit job already checks.
      - name: Build
        working-directory: boards
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-budget-key
          VITE_SUPABASE_ANON_KEY: ci-budget-key
        run: npx vite build

      - name: Bundle budget
        working-directory: boards
        run: node scripts/bundleBudget.mjs dist --report
