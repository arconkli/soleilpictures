# Cloudflare Workers Builds config for Soleil Boards.
# Worker entry handles /api/* routes (currently just /api/og for link
# previews); everything else falls through to env.ASSETS which serves
# the Vite-built dist/, with SPA fallback so /any/route hits index.html.

name = "soleil-boards"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Keep workers.dev enabled as a fallback URL while custom domain wiring
# settles (custom domain is bound via the CF dashboard, not via routes
# here, because zone provisioning needs to happen interactively).
workers_dev = true

# Retain Worker logs (fetch + scheduled handlers) in the Cloudflare dashboard
# so server-side errors caught in worker.js (/api/* try-catch + cron jobs) are
# inspectable. Client-side crashes go to Sentry; this is the server-side half.
# A fuller @sentry/cloudflare withSentry() wrapper is a possible follow-up.
[observability]
enabled = true

# Public Supabase config used by the /api/tags/* routes to verify the
# user's JWT against /auth/v1/user. Both values are public-by-design
# (the anon key is gated by RLS, not secrecy) — safe to commit.
# OPENAI_API_KEY is set separately via `wrangler secret put OPENAI_API_KEY`.
[vars]
SUPABASE_URL = "https://ehlhlmbpwwalmeisvmdp.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVobGhsbWJwd3dhbG1laXN2bWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NzYxNTIsImV4cCI6MjA5MzM1MjE1Mn0.gEySom06_L90FXAuTAz2S9rbQk-WNk6K3aReb2EwH1Y"
# The converter that makes playable copies of video and audio (media/, on Fly;
# worker-playCopy.js). Woken here; it authenticates back with MEDIA_BOX_SECRET,
# set via `wrangler secret put`. Until that secret exists nothing is woken.
MEDIA_BOX_URL = "https://soleil-media.fly.dev"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# No run_worker_first. A list of patterns here (["/"], 2026-10-20) made the
# assets layer answer every other miss with index.html in SPA mode, so /docs,
# /changelog, /vs/*, /share/*, /api/* and /api/unsubscribe never reached the
# Worker (preview, then production on 2026-10-22). edgeContext.test.mjs holds
# it out.

# Cloudflare Workers AI — powers the admin SEO tooling (/api/seo/*): a vision
# model captions board images for alt text, a text model drafts SEO copy.
# Free in-worker tier, no API key/credits. See boards/src/worker-seo.js.
[ai]
binding = "AI"

# Scheduled R2 orphan sweep — runs daily at 04:00 UTC, after the pg_cron
# retention jobs (03:00–03:10) have finished hard-purging soft-deleted
# rows. The Worker scans the `images` table for rows whose card no longer
# exists in card_index and which are older than 30 days, then deletes
# both the R2 object and the images row. Safe no-ops if the R2 binding
# or SUPABASE_SERVICE_ROLE_KEY secret is missing.
[triggers]
# Daily 04:00 UTC: history-aware R2 orphan sweep (dry-run by default), and the
#                    Workers AI model watch (src/worker-aiwatch.js), which pages
#                    when a model the app calls is retiring, gone or failing.
# Hourly at :15:     Job 1 compaction — board_ops → R2 hourly batches (dry-run by default).
# Every minute:      webhook drain — fan the outbox out and deliver what is due.
#                    This is the path that carries changes made IN THE APP;
#                    API-driven events are already delivered inline. It costs
#                    one indexed probe when there is nothing pending.
# Sundays 06:00 UTC: the AEO retrieval probe — asks an assistant the questions a
#                    buyer asks and records whether we are cited (migration
#                    0296, src/worker-aeo.js). Weekly because retrieval moves at
#                    the speed of index refreshes; daily would sample answer
#                    variance and read it as movement. No-ops without
#                    OPENAI_API_KEY. Also the week's new Workers AI models,
#                    one email when there are any. "0 6 * * 1" is SUNDAY:
#                    Cloudflare counts day-of-week 1 as Sunday.
# Hourly at :45:     R2 off-site mirror — copy new image/preview/op-batch objects
#                    into the LOCKED backup bucket (runR2Mirror). The DB dump
#                    only holds pointers to these; this holds the bytes. No-ops
#                    until the IMAGES_BACKUP binding below is enabled. Copy-only.
# event.cron lets the worker dispatch to the right handler in scheduled().
# To enable actual writes/deletes, set HISTORY_COMPACTION_MODE=run and/or
# R2_SWEEP_MODE=delete via `wrangler secret put`.
crons = ["0 4 * * *", "15 * * * *", "* * * * *", "0 6 * * 1", "45 * * * *"]

# The party Worker (boards/party), for this Worker's own calls into it: a
# move's /reset and the API's multipart uploads (lib/partyFetch.js). A Worker on
# workers.dev may not fetch another workers.dev Worker on the same account
# (Cloudflare error 1042), which is what the preview is, so by URL every move
# between clusters failed there.
[[services]]
binding = "PARTY"
service = "soleil-boards-party"

# R2 binding for the orphan sweeper. Matches PartyKit's R2_BUCKET so
# the same bucket uploads go into is the one being swept.
[[r2_buckets]]
binding     = "IMAGES"
bucket_name = "soleil-boards-images"

# ── R2 off-site mirror (runR2Mirror, cron "45 * * * *") ──────────────────────
# The mirror copies new objects into a SEPARATE, immutable bucket so the images
# have a second copy the DB dump cannot provide. The bucket carries a 90-day
# Bucket Lock (no delete, no overwrite — even for a compromised token) and a
# lifecycle rule (Infrequent Access after 30 days, NO expiry), both set
# 2026-09-14 via `wrangler r2 bucket lock|lifecycle add`. Copy-only: sweep
# deletions on the primary are never propagated.
#
# Wrangler REFUSES TO DEPLOY a binding to a bucket that does not exist, which is
# why this block shipped commented until the bucket was created. If the mirror
# ever has to be paused, comment these three lines again: runR2Mirror() returns
# immediately when the binding is absent. Its watermark lives in the PRIMARY
# bucket (_state/mirror.json) because the lock here forbids overwriting it.
[[r2_buckets]]
binding     = "IMAGES_BACKUP"
bucket_name = "soleil-boards-images-backup"

# Required secret (set via `wrangler secret put SUPABASE_SERVICE_ROLE_KEY`)
# for the R2 sweep to call SECURITY DEFINER RPCs (find_orphan_images,
# delete_image_rows). Without it the sweep logs and skips.

# ── Request limits across isolates (lib/edgeLimits.js) ───────────────────────
# Workers Rate Limiting: each limit counts across every isolate in a Cloudflare
# location, which the Worker's own per-isolate counters cannot. The names,
# limits and periods are EDGE_LIMITS in lib/edgeLimits.js, and
# edgeLimits.test.mjs holds the two equal; the docs read the numbers from
# there. Without these (dev, or a wrangler older than 4.36, which ignores
# [[ratelimits]]) the Worker holds the same limits per isolate. A namespace_id
# is this account's own counter: never give one to a second limit.
[[ratelimits]]
name = "OAUTH_REGISTER"
namespace_id = "7001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "OAUTH_TOKEN"
namespace_id = "7002"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "OAUTH_LOOKUP"
namespace_id = "7003"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "MCP_DRAFT_CREATE"
namespace_id = "7004"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "KEEP_BUNDLE"
namespace_id = "7005"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "SIGNED_IMAGE"
namespace_id = "7006"

  [ratelimits.simple]
  limit = 600
  period = 60
